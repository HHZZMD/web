<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的第一个网页</title>
  <style>
    :root {
      /* 颜色 */
      --color1: #0c3d90;
      --color2: #323c4e;
      --ink-dim: #060404;
      /* 边框 */
      --gap: 20px;
      --notch: 14px;
      --font-display: 'Oswald', 'Archivo Narrow', 'Arial Narrow', sans-serif;
      --font-mono: 'Share Tech Mono', ui-monospace, 'Cascadia Code', monospace;
      --font-cn: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --radius: 2px;
    }

    .notch {
      clip-path: polygon(0 0,
          calc(100% - var(--notch)) 0,
          100% var(--notch),
          100% 100%,
          var(--notch) 100%,
          0 calc(100% - var(--notch)));
    }

    /* 英文字体样式 */
    .en {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase
    }

    /* 中文字体样式 */
    .cn {
      font-family: var(--font-cn);
      letter-spacing: .3em;
      color: var(--ink-dim)
    }

    body {
      margin: 0;
      background-color: rgb(0, 0, 0);
      display: flex;
      flex-direction: row;


    }




    button.a1 {
      opacity: 0.1;
      background-color: var(--color1);
      color: #000000;
      height: 30px;
      width: 100px;
    }

    .a1:hover {
      opacity: 1;
      border: solid #d70404 1px
    }

    /* ************************************************************************* */
    /* div 样式 */
    div.toubu {
      background-color: var(--color2);
    }

    /* 区域样式透明度 */
    div.vid {
      opacity: 1;
    }

    /* 鼠标悬停时增加不透明度。显示边框 */
    div:hover.vid {
      opacity: 1;
      border: 2px solid #860101;
    }

    div:hover.toubu {
      opacity: 1;
      border: 2px solid #4a7fb5;
    }

    div.cebiangyingcang {
      display: none
    }

    /* ************************************************************************ */
    .flex {
      display: flex;
    }

    .boxcolor {
      opacity: 0.4;
      background: linear-gradient(187deg, #2d3f7a 0%, #4a63c8 50%, #8ec5c8 100%);
    }



    .ba {
      background-color: rgba(12, 217, 224, 0.466);
    }

    .flex1 {
      flex: 1;
    }

    .column {
      display: flex;
      flex-direction: column;
    }

    .bianju {
      margin: 8px;
    }

    .mgt8 {
      margin-top: 8px;
    }

    .mgl8 {
      margin-left: 8px;
    }

    .mgr8 {
      margin-right: 8px;
    }

    /* img { width:100%; -ms-interpolation-mode: bicubic;}  
        // 保留此样式以便将来为图片设置宽度和插值模式
     */
  </style>

  <!-- margin：边距，background-color：背景颜色 -->
</head>

<body>
  <!-- 侧边栏 ***********************************************************-->
  <div style="width: 20%;z-index: 2;" class="boxcolor flex column bianju vid cebiangyingcang">
    <!-- 头像或图标 -->
    <div style="height: 100px;" class="toubu vid">
      <p style="font-size: 20px; margin: 18px;color: #ff1500;text-align: center; text-decoration: dashed;">
        <b>hello</b>HTML
      </p>
    </div>
    <div class="vid"></div>
    <div class="vid"></div>
    <div class="vid"></div>
  </div>
  <!--主区域 ***********************************************************-->
  <div class="flex1  flex column">

    <!--头部栏-->
    <div style="height: 100px;z-index: 1;" class="toubu bianju notch">
      <button class="a1 cn">按钮</button>
      <h1 class="en">PERSONAL WEBSITE</h1>

    </div>
    <!--内容-->
    <div class=" flex notch">
      <!--左区-->
      <div style="flex: 3;" class="flex column notch">
        <!-- 数据区 -->
        <div style="height:200px ;" class="flex  bianju boxcolor notch">
          <p class="en "><b class="cn">胡</b>hello</p>

        </div>
        <!-- 滚动区 -->
        <div class="flex column">
          <div style="height: 30vh;" class="boxcolor bianju">
            <!-- <img src="历史时刻.jpg" width="100%"> -->
          </div>
          <div style="height: 30vh;" class="boxcolor bianju"></div>


        </div>
      </div>


    </div>

  </div>

</body>


</html>
